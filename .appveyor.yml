image: Visual Studio 2022

configuration:
  - Release
  - Debug

platform:
  - x64
  - Win32

environment:
  CMAKE_OPTIONS: "-A \"%platform%\" -DCMAKE_BUILD_TYPE=\"%configuration%\" -DUSE_STATIC_RUNTIME=ON"
  # Selects the MSYS2 subsystem whose bin directory a login shell puts on PATH;
  # MINGW64 is the one carrying the native x86_64 gcc the autotest compiles with.
  MSYSTEM: MINGW64
  # VS VERSION IN CMAKE STYLE
  matrix:
    - VSVERSION: "17 2022"
    - VSVERSION: "16 2019"
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2019

# No matrix exclusions: both toolchains build x64 and Win32 (8 jobs).
#
# VS2026 was tried and removed. The "Visual Studio 2026" worker image exists and
# ships MSBuild 18.7.8, but its CMake (4.1.2) has no "Visual Studio 18 2026"
# generator -- its newest is "Visual Studio 17 2022" -- so every VS2026 job died
# at configure with "Could not create named generator". Revisit when the image
# carries a CMake that knows VS18, or drive it through Ninja instead.

init:
  - cmake --version
  - msbuild /version
  # Worker width, so the autotest's -j decision rests on a measurement rather
  # than an assumption about the image. The autotest cell runs serial today
  # (WFB_JOBS=1 below); if this reports enough cores, raising it is a one-word
  # change backed by the local result that -j16 and serial agree on all 776
  # verdicts.
  - echo cores=%NUMBER_OF_PROCESSORS%

# Setup for the bison autotest -- only in the cell that runs it. The harness now
# runs on MSYS2 (C:\msys64, pre-installed on this image) instead of WSL: MSYS2
# executes win_bison.exe as an ordinary child process, so there is no WSLENV
# forwarding, no interop binfmt entry to repair, and no rootfs-visibility
# constraint on the work dir. It also supplies autom4te and a compiler from the
# same package manager, which WSL1/Ubuntu 20.04 could not do consistently.
#
# autoconf2.71 is pinned deliberately, not incidentally: autom4te expands the
# .at sources, so 2.69 and 2.71 produce different testsuites with different
# group numbering, and an xfail list calibrated on one does not describe the
# other. Pinning it here matches the local dev setup.
#
# mingw-w64-x86_64-gcc is NOT optional: run.sh's xfail list was calibrated with
# gcc/g++ present. Without them the compile tiers auto-skip, a different set of
# groups runs, and the list stops describing reality.
#
# The baseline clone is required too: two groups read fixtures from it
# (regression.at wants src/parse-gram.y, torture.at wants tests/linear), and
# run.sh looks for it at PORT_ROOT/../upstream/bison -- which exists in the
# superproject but not in a bare AppVeyor checkout of this repo. Shallow is
# enough: only the tree at v3.8.2 is read, never its history.
install:
  - if "%VSVERSION%_%platform%_%configuration%"=="17 2022_x64_Release" C:\msys64\usr\bin\bash -lc "pacman -Sy --noconfirm --needed autoconf2.71 m4 perl diffutils sed grep gawk mingw-w64-x86_64-gcc"
  - if "%VSVERSION%_%platform%_%configuration%"=="17 2022_x64_Release" git clone --quiet --depth 1 --branch v3.8.2 https://github.com/akimd/bison.git "%APPVEYOR_BUILD_FOLDER%\..\upstream\bison"

before_build:
  - set VSVERSIONSHORT=%VSVERSION:~3,4%
  - if "%APPVEYOR_REPO_TAG_NAME%"=="" ( set "APPVEYOR_REPO_TAG_NAME=dev-vs-%VSVERSIONSHORT%-%platform%-%configuration%" )
  - mkdir build
  - cd build
  - cmake -G "Visual Studio %VSVERSION%" -DCPACK_PACKAGE_VERSION="%APPVEYOR_REPO_TAG_NAME%" %CMAKE_OPTIONS% ..

build_script:
  - cmake --build . --config %configuration%

# Windows CTest gate: EVERY cell. The test executables are compiled in all of
# them regardless (ALL_BUILD includes them), so running them costs only test
# time -- ~19s -- and is the difference between building the tests and actually
# testing the toolchain/platform/configuration that cell represents.
#
# The bison GNU Autotest (776 groups) runs in ONE cell: it drives win_bison.exe
# through a POSIX harness, so it exercises bison's behaviour rather than the
# MSVC toolchain, and running it 8x would buy nothing for 8x the time.
#
# run.sh is invoked by absolute path rather than after a `cd`: a login shell
# (-l, needed so MSYSTEM=MINGW64 puts the compilers on PATH) starts in the MSYS2
# home directory and discards whatever directory cmd was in. run.sh derives
# everything else from its own location. run.sh exits non-zero only on
# UNEXPECTED failures -- its BISON_XFAIL list absorbs the known
# environment-limited ones.
test_script:
  - ctest --test-dir "%APPVEYOR_BUILD_FOLDER%\build" -C %configuration% --output-on-failure --no-tests=error
  # NON-GATING for this first MSYS2 run (`ver > nul` resets ERRORLEVEL). The
  # reason it was non-gating before -- autoconf 2.69 on the image vs 2.71
  # locally, generating different testsuites -- is gone now that install:
  # pins autoconf2.71 on both sides. Drop the `& ver > nul` to make it gate
  # again once one green run has confirmed that.
  # WFB_JOBS=1 keeps this cell serial. run.sh defaults to parallel (min(nproc,16))
  # because that is a large win on a dev box, but a hosted worker is narrow, so
  # the gain is small while concurrency risk lands on the only job carrying deep
  # win_bison signal. Revisit once the cores= line above says otherwise.
  - if "%VSVERSION%_%platform%_%configuration%"=="17 2022_x64_Release" (set WFB_JOBS=1 && C:\msys64\usr\bin\bash -lc "$(cygpath -u '%APPVEYOR_BUILD_FOLDER%')/tests/bison-autotest/run.sh" & ver > nul)

# Packaging runs after the tests so a failing test aborts the build before a
# zip exists. AppVeyor collects artifacts after after_test, so this still ships.
# Path given explicitly rather than relying on before_build's `cd build` still
# being in effect this late in the job.
#
# --config is REQUIRED: multi-config generators default to Debug, so without it
# this step silently rebuilt the whole project (tests included) in Debug on top
# of the real build -- roughly doubling every job.
after_test:
  - cmake --build "%APPVEYOR_BUILD_FOLDER%\build" --config %configuration% --target package

artifacts:
  - path: build/win_flex_bison*.zip
