image: Visual Studio 2022

configuration:
  - Release
  - Debug

platform:
  - x64
  - Win32

environment:
  CMAKE_OPTIONS: "-A \"%platform%\" -DCMAKE_BUILD_TYPE=\"%configuration%\" -DUSE_STATIC_RUNTIME=ON"
  # Selects the MSYS2 subsystem whose bin directory a login shell puts on PATH;
  # MINGW64 is the one carrying the native x86_64 gcc the autotest compiles with.
  MSYSTEM: MINGW64
  # VS VERSION IN CMAKE STYLE
  matrix:
    - VSVERSION: "17 2022"
      WFB_JOB: build
    - VSVERSION: "16 2019"
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2019
      WFB_JOB: build
    # The bison GNU Autotest gets its own job (WFB_JOB=autotest), not a step
    # bolted onto a build cell. Three reasons: it needs the FULL 60-minute
    # per-job budget (it ran 40 min of a 46 min job, and 53 min of a 59 min one
    # before -j2), a failure there should not be able to abort packaging, and
    # allow_failures below makes it non-gating honestly -- the job goes red while
    # the build stays green -- instead of by discarding the exit code.
    - VSVERSION: "17 2022"
      WFB_JOB: autotest

# The 2 build entries x 2 configurations x 2 platforms give the same 8 build jobs
# as before. The autotest entry would add 4 more, so 3 are excluded: it runs once,
# on x64/Release, because it exercises bison's BEHAVIOUR rather than the
# toolchain/platform/configuration a cell represents -- running it 4x would cost
# 4x the time for no additional signal.
#
# VS2026 was tried and removed. The "Visual Studio 2026" worker image exists and
# ships MSBuild 18.7.8, but its CMake (4.1.2) has no "Visual Studio 18 2026"
# generator -- its newest is "Visual Studio 17 2022" -- so every VS2026 job died
# at configure with "Could not create named generator". Revisit when the image
# carries a CMake that knows VS18, or drive it through Ninja instead.
matrix:
  exclude:
    - WFB_JOB: autotest
      configuration: Debug
    - WFB_JOB: autotest
      platform: Win32
  # Non-gating: this job may fail without failing the build. It reports on
  # upstream bison behaviour through a POSIX harness, and carries 12 documented
  # xfails whose set can shift with the worker's locale/toolchain, so it is a
  # signal to read rather than a gate to trip. run.sh still exits non-zero only
  # on UNEXPECTED failures.
  allow_failures:
    - WFB_JOB: autotest

init:
  - cmake --version
  - msbuild /version
  # Worker width, so the autotest's -j decision rests on a measurement rather
  # than an assumption about the image. Measured 2 on the VS2022 image, which is
  # what WFB_JOBS below is set to; re-check here if the image ever changes.
  - echo cores=%NUMBER_OF_PROCESSORS%

# Setup for the bison autotest -- only in the cell that runs it. The harness now
# runs on MSYS2 (C:\msys64, pre-installed on this image) instead of WSL: MSYS2
# executes win_bison.exe as an ordinary child process, so there is no WSLENV
# forwarding, no interop binfmt entry to repair, and no rootfs-visibility
# constraint on the work dir. It also supplies autom4te and a compiler from the
# same package manager, which WSL1/Ubuntu 20.04 could not do consistently.
#
# autoconf2.71 is pinned deliberately, not incidentally: autom4te expands the
# .at sources, so 2.69 and 2.71 produce different testsuites with different
# group numbering, and an xfail list calibrated on one does not describe the
# other. Pinning it here matches the local dev setup.
#
# mingw-w64-x86_64-gcc is NOT optional: run.sh's xfail list was calibrated with
# gcc/g++ present. Without them the compile tiers auto-skip, a different set of
# groups runs, and the list stops describing reality.
#
# The baseline clone is required too: two groups read fixtures from it
# (regression.at wants src/parse-gram.y, torture.at wants tests/linear), and
# run.sh looks for it at PORT_ROOT/../upstream/bison -- which exists in the
# superproject but not in a bare AppVeyor checkout of this repo. Shallow is
# enough: only the tree at v3.8.2 is read, never its history.
#
# A D compiler for the issue #89 skeleton test, in one build cell only. The
# generated D parser is checked by content everywhere (that gate needs nothing
# installed); this turns the same file into a real compile once per build. It
# goes in an existing cell rather than a cell of its own because jobs here run
# serially: a new cell would rebuild win_bison from scratch, ~6 min on every
# push, to reach a 0.1 s check. This cell takes ~5 min of a 60 min budget.
#
# Deliberately non-fatal -- the `|| echo` swallows a choco failure (and says so
# in the log) without `exit /b`, which would end the whole install script and
# silently skip any line added after this one. If the install does not happen,
# CMake finds no D compiler, does not register bison.d_skeleton_compiles, and
# the cell stays green on the content checks. A Chocolatey outage must not
# redden a build over an optional extra.
install:
  - if "%WFB_JOB%"=="build" if "%VSVERSION%"=="17 2022" if "%platform%"=="x64" if "%configuration%"=="Release" (choco install ldc -y --no-progress || echo LDC install failed - the D compile check will not run)
  - if "%WFB_JOB%"=="autotest" C:\msys64\usr\bin\bash -lc "pacman -Sy --noconfirm --needed autoconf2.71 m4 perl diffutils sed grep gawk mingw-w64-x86_64-gcc"
  - if "%WFB_JOB%"=="autotest" git clone --quiet --depth 1 --branch v3.8.2 https://github.com/akimd/bison.git "%APPVEYOR_BUILD_FOLDER%\..\upstream\bison"

before_build:
  - set VSVERSIONSHORT=%VSVERSION:~3,4%
  - if "%APPVEYOR_REPO_TAG_NAME%"=="" ( set "APPVEYOR_REPO_TAG_NAME=dev-vs-%VSVERSIONSHORT%-%platform%-%configuration%" )
  - mkdir build
  - cd build
  - cmake -G "Visual Studio %VSVERSION%" -DCPACK_PACKAGE_VERSION="%APPVEYOR_REPO_TAG_NAME%" %CMAKE_OPTIONS% ..

# The build log is captured rather than streamed so the warning gate below can
# read it; `type` puts it back on the console, so the job output is unchanged
# apart from arriving at the end of the step instead of live.
#
# Zero warnings is the state the tree is in as of the build-warnings cleanup
# (see docs/build-warnings-plan.md in the superproject), and this is what keeps
# it that way. /WX covers the test targets from CMake, but deliberately NOT the
# vendored ones -- win_flex, win_bison, winflexbison_common, fl and y -- because
# a compiler error there would break the build on upgrade day. This gate covers
# them instead: a new warning anywhere turns the cell red, and the log says
# what it was, which is a decision to make rather than a build to fix.
#
# The pattern is ": warning " and not " warning ", and findstr /c is
# case-sensitive. Together that matches the one shape a real diagnostic has --
# "foo.c(12,1): warning C4244: ..." from cl, "... : warning MSB3026: ..." from
# MSBuild -- while ignoring prose that merely contains the word. Two things
# would otherwise trip it: MSBuild's "0 Warning(s)" summary (wrong case), and
# CMake's own "This warning is for project developers" line, which follows
# every CMP0091/CMP0092 deprecation notice. That CMake text normally never
# reaches build.log, since configure runs in before_build -- but ZERO_CHECK
# re-runs configure inside the build whenever CMakeLists.txt changes, which is
# exactly when someone is least pleased to get a spurious red cell.
#
# To land an upgrade before the warnings are dealt with, comment out the
# findstr line -- do not weaken it to a count.
#
# The first line types the log itself on failure: AppVeyor stops the job at the
# first non-zero step, so without that a broken build would show no output at
# all.
#
# The findstr line MUST stay single-quoted. A plain YAML scalar cannot hold
# ": " -- the parser reads it as a key/value split, so an unquoted version of
# this line either becomes a mapping (silently not the command we meant) or
# fails the whole file with "Mapping values are not allowed in this context".
# Both happened here before the quotes went on.
build_script:
  - cmake --build . --config %configuration% > build.log 2>&1 || (type build.log & exit /b 1)
  - type build.log
  - 'findstr /c:": warning " build.log && (echo GATE - build produced warnings, see above & exit /b 1) || exit /b 0'

# Windows CTest gate: EVERY build cell. The test executables are compiled in all
# of them regardless (ALL_BUILD includes them), so running them costs only test
# time -- ~19s -- and is the difference between building the tests and actually
# testing the toolchain/platform/configuration that cell represents. It is NOT
# run in the autotest job, which would only repeat the x64/Release cell.
#
# The autotest job runs the bison GNU Autotest (776 groups) instead. run.sh is
# invoked by absolute path rather than after a `cd`: a login shell (-l, needed so
# MSYSTEM=MINGW64 puts the compilers on PATH) starts in the MSYS2 home directory
# and discards whatever directory cmd was in. run.sh derives everything else from
# its own location.
#
# The exit code is NOT discarded here any more (the old `& ver > nul`): the job
# is allowed to fail via matrix.allow_failures, so a real failure now shows as a
# red job against a green build instead of hiding in the log.
#
# WFB_JOBS=2 matches the worker (cores=2, measured by the init: line above). It
# is a timeout defence, not a speed tweak: serial, the suite took 53 min of a
# 59m03s job against AppVeyor's 60-minute per-job limit; -j2 brought it to 40 min
# of 46. Parallel safety is measured, not assumed -- -j16 on 32 cores and -j2 on
# this worker both reproduced all 776 serial verdicts exactly.
test_script:
  - if not "%WFB_JOB%"=="autotest" ctest --test-dir "%APPVEYOR_BUILD_FOLDER%\build" -C %configuration% --output-on-failure --no-tests=error
  - if "%WFB_JOB%"=="autotest" (set WFB_JOBS=2 && C:\msys64\usr\bin\bash -lc "$(cygpath -u '%APPVEYOR_BUILD_FOLDER%')/tests/bison-autotest/run.sh")

# Packaging runs after the tests so a failing test aborts the build before a
# zip exists. AppVeyor collects artifacts after after_test, so this still ships.
# Path given explicitly rather than relying on before_build's `cd build` still
# being in effect this late in the job.
#
# Skipped in the autotest job: its zip would duplicate the x64/Release cell's,
# and packaging there would make a non-gating job able to publish an artifact.
#
# --config is REQUIRED: multi-config generators default to Debug, so without it
# this step silently rebuilt the whole project (tests included) in Debug on top
# of the real build -- roughly doubling every job.
after_test:
  - if not "%WFB_JOB%"=="autotest" cmake --build "%APPVEYOR_BUILD_FOLDER%\build" --config %configuration% --target package

artifacts:
  - path: build/win_flex_bison*.zip
